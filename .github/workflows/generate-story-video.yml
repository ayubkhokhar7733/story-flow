name: Generate AI Story Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Story topic or prompt'
        required: true
        default: 'Chacha Bashir and the Secret Underground Tunnel of Lahore Fort'
        type: string
      character:
        description: 'Featured Stylized 3D Character'
        required: true
        default: 'chacha_bashir'
        type: choice
        options:
          - 'chacha_bashir'
          - 'zainab_explorer'
          - 'raja_veer'
          - 'baba_fazal'
          - 'none'
      aspect:
        description: 'Video Format (9:16 for Shorts / 16:9 for Landscape)'
        required: true
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '16:9'
      voice:
        description: 'Narrator Voice'
        required: true
        default: 'guy'
        type: choice
        options:
          - 'guy'         # English Engaging Male (Chacha Bashir)
          - 'jenny'       # English Adventurous Female (Zainab)
          - 'christopher' # English Deep Epic Male (Raja Veer)
          - 'eric'        # English Gentle Wise Male (Baba Fazal)
          - 'asad'        # Urdu Male (Pakistan)
          - 'uzma'        # Urdu Female (Pakistan)
      duration:
        description: 'Target duration in seconds'
        required: true
        default: 60
        type: number
      upload_to_youtube:
        description: 'Upload generated video directly to YouTube test channel?'
        required: true
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status (unlisted is recommended for test inspection)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - 'unlisted'
          - 'private'
          - 'public'

jobs:
  build-story-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Story Video
        env:
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY || '0000000000' }}
          AI_HORDE_CLIENT_AGENT: 'StoryFlow-CI:1.0.0:github-actions'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || '' }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || '' }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || '' }}
        run: |
          TOPIC="${{ github.event.inputs.topic || 'Chacha Bashir and the Secret Underground Tunnel of Lahore Fort' }}"
          ASPECT="${{ github.event.inputs.aspect || '9:16' }}"
          VOICE="${{ github.event.inputs.voice || 'guy' }}"
          DURATION="${{ github.event.inputs.duration || '60' }}"
          CHAR="${{ github.event.inputs.character || 'chacha_bashir' }}"
          UPLOAD_YT="${{ github.event.inputs.upload_to_youtube }}"
          PRIVACY="${{ github.event.inputs.privacy_status || 'unlisted' }}"

          echo ">> Running AI Storyflow Generator..."
          echo "Topic: $TOPIC"
          echo "Character: $CHAR"
          echo "Aspect: $ASPECT"
          echo "Voice: $VOICE"
          echo "Duration: $DURATION seconds"
          echo "Upload to YouTube: $UPLOAD_YT ($PRIVACY)"

          CMD="python generate_story_video.py --topic \"$TOPIC\" --aspect \"$ASPECT\" --voice \"$VOICE\" --duration \"$DURATION\""
          if [ "$CHAR" != "none" ]; then
            CMD="$CMD --character \"$CHAR\""
          fi
          if [ "$UPLOAD_YT" = "true" ]; then
            CMD="$CMD --upload-youtube --privacy \"$PRIVACY\""
          fi

          eval $CMD

      - name: List Generated Videos
        run: |
          echo "### Generated Artifacts:"
          ls -lh output/

      - name: Upload Video as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-video-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 14

      - name: Job Summary
        run: |
          echo "## 🎬 AI Story Video Generation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Topic:** ${{ github.event.inputs.topic || 'Story Video' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Character:** \`${{ github.event.inputs.character || 'chacha_bashir' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** ${{ github.event.inputs.aspect || '9:16' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Voice:** ${{ github.event.inputs.voice || 'guy' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Download Artifact:** You can download the full MP4 directly from this run's **Artifacts** tab." >> $GITHUB_STEP_SUMMARY
